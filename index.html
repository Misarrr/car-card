<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Связаться со мной</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --card: #161616;
      --border: #2a2a2a;
      --accent: #e8ff47;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #888;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(232,255,71,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(380px, 92vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 36px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(232,255,71,0.05),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .car-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #1e1e1e, #252525);
      border: 1px solid var(--border);
      border-radius: 20px;
      margin-bottom: 20px;
      font-size: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: fadeUp 0.6s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .tag {
      display: inline-block;
      background: rgba(232,255,71,0.1);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 14px;
      border: 1px solid rgba(232,255,71,0.2);
      animation: fadeUp 0.6s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .car-model {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.12em;
      color: var(--accent2);
      margin-bottom: 10px;
      animation: fadeUp 0.6s 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 0.04em;
      line-height: 1;
      color: #fff;
      margin-bottom: 8px;
      animation: fadeUp 0.6s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
      animation: fadeUp 0.6s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin-bottom: 28px;
      animation: fadeUp 0.6s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.15s;
    }

    .btn:active {
      transform: scale(0.97) !important;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* Call button */
    .btn-call {
      background: var(--accent);
      color: #0d0d0d;
      box-shadow: 0 4px 20px rgba(232,255,71,0.25);
      animation: fadeUp 0.6s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .btn-call:hover {
      box-shadow: 0 8px 32px rgba(232,255,71,0.4);
      filter: brightness(1.05);
    }

    /* Telegram button */
    .btn-tg {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #2a2a2a;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: fadeUp 0.6s 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .btn-tg:hover {
      border-color: #2aabee;
      box-shadow: 0 8px 24px rgba(42,171,238,0.15);
    }
    .btn-tg .btn-icon { color: #2aabee; }

    /* VK button */
    .btn-vk {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #2a2a2a;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: fadeUp 0.6s 0.49s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .btn-vk:hover {
      border-color: #4c75a3;
      box-shadow: 0 8px 24px rgba(76,117,163,0.2);
    }
    .btn-vk .btn-icon { color: #4c75a3; }

    .btn-icon {
      flex-shrink: 0;
      display: flex;
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
    }

    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: #444;
      animation: fadeUp 0.6s 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Ripple */
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }
    .ripple-el {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      width: 60px; height: 60px;
      transform: scale(0);
      animation: ripple 0.5s linear;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="tag">Владелец KIA Spectra &nbsp;·&nbsp; Михаил</div>
  <h1>Есть<br><span>вопрос?</span></h1>
  <p class="subtitle">Свяжитесь со мной удобным способом</p>
  <div class="divider"></div>

  <div class="buttons">

    <!-- Call -->
    <a href="tel:+79618610530" class="btn btn-call" onclick="addRipple(event)">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12a19.79 19.79 0 0 1-3-8.59A2 2 0 0 1 3.13 1.28h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </span>
      Позвонить
    </a>

    <!-- Telegram -->
    <a href="https://t.me/Misarrr" target="_blank" rel="noopener" class="btn btn-tg" onclick="addRipple(event)">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/>
        </svg>
      </span>
      Написать в Telegram
    </a>

    <!-- VK -->
    <a href="https://vk.com/misarrr" target="_blank" rel="noopener" class="btn btn-vk" onclick="addRipple(event)">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.785 16.241s.288-.032.436-.194c.136-.148.132-.427.132-.427s-.02-1.304.585-1.496c.598-.19 1.365 1.26 2.179 1.815.615.418 1.082.327 1.082.327l2.175-.03s1.138-.071.598-1.223c-.044-.094-.313-.663-1.609-1.875-1.356-1.267-1.174-1.062.459-3.254.999-1.333 1.398-2.146 1.273-2.494-.12-.333-.854-.245-.854-.245l-2.447.015s-.181-.025-.316.056c-.132.079-.217.264-.217.264s-.387 1.032-.903 1.91c-1.088 1.85-1.524 1.948-1.703 1.834-.414-.267-.311-1.075-.311-1.649 0-1.793.272-2.54-.529-2.733-.265-.064-.46-.106-1.138-.113-.869-.009-1.604.003-2.02.207-.277.135-.491.437-.361.454.161.022.526.099.72.363.249.341.24 1.107.24 1.107s.143 2.11-.333 2.372c-.327.179-.775-.187-1.737-1.861-.493-.854-.866-1.8-.866-1.8s-.072-.178-.202-.274a.996.996 0 0 0-.378-.137l-2.324.015s-.349.01-.477.162c-.114.135-.009.414-.009.414s1.82 4.26 3.878 6.409c1.888 1.974 4.03 1.843 4.03 1.843h.971z"/>
        </svg>
      </span>
      Написать во ВКонтакте
    </a>

  </div>

  <p class="footer">Нажмите на кнопку — я отвечу как можно скорее</p>
</div>

<script>
  function addRipple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const x = e.clientX - rect.left - 30;
    const y = e.clientY - rect.top - 30;
    const ripple = document.createElement('span');
    ripple.className = 'ripple-el';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }
</script>

</body>
</html>
